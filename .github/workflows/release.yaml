name: Release

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'The tag of the release the artifacts will be published to'
        required: false
        type: string
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-upload:
    name: Build and Upload Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-${{ inputs.publish_tag || github.ref_name }}.tgz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: flutter_rust_bridge_codegen-x86_64-unknown-linux-musl-${{ inputs.publish_tag || github.ref_name }}.tgz
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            name: flutter_rust_bridge_codegen-i686-unknown-linux-musl-${{ inputs.publish_tag || github.ref_name }}.tgz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: flutter_rust_bridge_codegen-aarch64-unknown-linux-musl-${{ inputs.publish_tag || github.ref_name }}.tgz
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            name: flutter_rust_bridge_codegen-arm-unknown-linux-musleabihf-${{ inputs.publish_tag || github.ref_name }}.tgz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: flutter_rust_bridge_codegen-x86_64-apple-darwin-${{ inputs.publish_tag || github.ref_name }}.tgz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: flutter_rust_bridge_codegen-aarch64-apple-darwin-${{ inputs.publish_tag || github.ref_name }}.tgz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: flutter_rust_bridge_codegen-x86_64-pc-windows-msvc-${{ inputs.publish_tag || github.ref_name }}.zip
          - target: i686-pc-windows-msvc
            os: windows-latest
            name: flutter_rust_bridge_codegen-i686-pc-windows-msvc-${{ inputs.publish_tag || github.ref_name }}.zip
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            name: flutter_rust_bridge_codegen-x86_64-unknown-freebsd-${{ inputs.publish_tag || github.ref_name }}.tgz
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: |
            --release --target ${{ matrix.target }} --manifest-path frb_codegen/Cargo.toml
          use-cross: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Post-build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $binary = "target/${{ matrix.target }}/release/flutter_rust_bridge_codegen.exe"
          if (!(Test-Path -Path $binary -PathType Leaf) -or (Get-Item $binary).Length -eq 0) {
            throw "Missing or empty release binary: $binary"
          }
          if ('${{ matrix.target }}' -eq 'x86_64-pc-windows-msvc') {
            & $binary --version
            if ($LASTEXITCODE -ne 0) {
              throw "Release binary smoke check failed with exit code $LASTEXITCODE"
            }
          }
          7z a "${{ matrix.name }}" $binary
          if (!(Test-Path -Path '${{ matrix.name }}' -PathType Leaf) -or (Get-Item '${{ matrix.name }}').Length -eq 0) {
            throw 'Missing or empty release archive: ${{ matrix.name }}'
          }
          7z t "${{ matrix.name }}"
      - name: Post-build (*nix)
        if: matrix.os != 'windows-latest'
        run: |
          binary="target/${{ matrix.target }}/release/flutter_rust_bridge_codegen"
          test -s "$binary"
          case "$(uname -s):$(uname -m):${{ matrix.target }}" in
            Linux:x86_64:x86_64-unknown-linux-gnu|Linux:x86_64:x86_64-unknown-linux-musl|Darwin:x86_64:x86_64-apple-darwin|Darwin:arm64:aarch64-apple-darwin)
              "$binary" --version
              ;;
          esac
          tar czvf "${{ matrix.name }}" -C "$(dirname "$binary")" "$(basename "$binary")"
          test -s "${{ matrix.name }}"
          tar tzf "${{ matrix.name }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error
          overwrite: true
  upload-artifacts:
    name: Add Build Artifacts to Release
    needs: build-upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: downloaded-release-artifacts
      - name: Verify and stage complete artifact set
        run: .github/scripts/verify-release-artifacts.sh downloaded-release-artifacts release-assets "${{ inputs.publish_tag || github.ref_name }}"
      - name: Add Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_tag != '' && inputs.publish_tag) || github.ref_name }}
  refresh-homebrew:
    name: Refresh Homebrew formula
    runs-on: ubuntu-latest
    needs: upload-artifacts
    steps:
      - uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: flutter_rust_bridge_codegen
          homebrew-tap: Desdaemon/homebrew-repo
          tag-name: ${{ inputs.publish_tag || github.ref_name }}
        env:
          COMMITTER_TOKEN: ${{ secrets.GH_PAT }}
